name: Bounty claim coordination
description: Queue claim commands and mirror durable central reservations into source issues.
inputs:
  comment-id:
    description: Existing comment ID to reconcile, or empty to recover all claims in this repository.
    required: false
    default: ''
  dry-run:
    description: Inspect decisions without changing comments or assignments.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        ASTRAL_CLAIM_ACTION_PATH: ${{ github.action_path }}
        ASTRAL_CLAIM_COMMENT_ID: ${{ inputs.comment-id }}
        ASTRAL_CLAIM_DRY_RUN: ${{ inputs.dry-run }}
      with:
        retries: 0
        script: |
          const { replyToClaim } = require(process.env.ASTRAL_CLAIM_ACTION_PATH + '/index.cjs');
          const result = await replyToClaim({ github, context, commentId: process.env.ASTRAL_CLAIM_COMMENT_ID, dryRun: process.env.ASTRAL_CLAIM_DRY_RUN });
          core.info(JSON.stringify(result));
