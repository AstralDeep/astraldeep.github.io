name: Release sync
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-board
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.discover.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run check && npm test
      - name: Compare the newest Mac release with the live Downloads record
        id: discover
        run: node scripts/release-discovery-cli.mjs --live https://astraldeep.github.io/data/downloads.json --github-output "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
  build:
    needs: sync
    if: github.ref == 'refs/heads/main' && needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run check && npm test
      - name: Retain the published ledger-matching board snapshot
        run: node scripts/retain-site-snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    needs: [sync, build]
    if: github.ref == 'refs/heads/main' && needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require current main before publication
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
